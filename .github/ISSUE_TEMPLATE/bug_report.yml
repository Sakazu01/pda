name: Bug report
description: Something in PDA doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open example …\n2. Drag …\n3. …"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: Chrome 130 on Windows 11
    validations:
      required: true
  - type: textarea
    id: file
    attributes:
      label: Diagram file
      description: If you can, attach the .json export (Ekspor → JSON) that shows the bug.
