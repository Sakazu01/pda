name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs && cp dist/index.html pda.html
      - name: Publish release with the single-file app
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk "/^## \[${GITHUB_REF_NAME#v}\]/{f=1;next} /^## \[/{f=0} f" CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" pda.html --title "PDA $GITHUB_REF_NAME" --notes "$notes"
